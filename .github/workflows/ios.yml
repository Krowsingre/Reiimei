# Builds the Reiimei iPhone app on one of GitHub's Macs and sends it to TestFlight.
# Signing uses an App Store Connect API key kept in this repository's secrets (Settings › Secrets
# and variables › Actions): APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8.
# No Apple password is used anywhere. The web app on main is not affected.
name: iPhone app

on:
  push:
    branches: [native]
    paths: ['mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: iPhone app for TestFlight
    # App Store Connect only takes apps built with Xcode 26 or later.
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # Says which of the four Apple secrets GitHub has (never their values).
      - name: Check the Apple secrets are there
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::error::The secret $name is missing or empty."; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the app's packages
        run: npm install --no-audit --no-fund

      # The Xcode project is made fresh each time from app.json, so nothing generated is kept here.
      - name: Make the Xcode project
        run: npx expo prebuild --platform ios --clean

      - name: Put the App Store Connect key in place
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8

      # Each build gets the next number, as TestFlight requires; the version stays as in app.json.
      - name: Number the build
        run: |
          plist=$(ls ios/*/Info.plist | grep -v Tests | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
          echo "Build ${{ github.run_number }} ($plist)"

      # Xcode signs the app itself, using the key to fetch (or make) the certificate and profile.
      - name: Build and sign the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          cd ios
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          auth=(-allowProvisioningUpdates -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER" -authenticationKeyPath "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8")
          xcodebuild archive -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/Reiimei.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Automatic
          cat > /tmp/export-options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/Reiimei.xcarchive" -exportPath "$PWD/build/export" -exportOptionsPlist /tmp/export-options.plist "${auth[@]}"

      - name: Keep the app file
        uses: actions/upload-artifact@v4
        with:
          name: reiimei-iphone
          path: mobile/ios/build/export/*.ipa
          if-no-files-found: error

      - name: Send to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ipa=$(ls ios/build/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
